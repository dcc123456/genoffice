name: Release

# Builds the installers for a version tag and attaches them to the release.
#
# macOS: the dmg is built on a macOS runner. Xcode is installed there, so the
# on-device OCR helper compiles — a maintainer machine with only the
# CommandLineTools cannot build Swift at all (its module map redefines
# SwiftBridging) and would ship an app whose scanned pages stay bitmaps.
#
# Windows: the NSIS installer needs the Windows toolchain (it stamps the icon
# and the version resources into the executable), and cross-compiling it from
# macOS needs wine - Homebrew disabled every wine cask in September 2026 -
# so the Windows package is built on a Windows runner instead.
#
# The two build jobs only produce build artifacts. Attaching them is the
# publish job's job, and it runs in bash with `set -euo pipefail`: a failed
# upload has to fail the job, not slip through because the last command of
# the step happened to succeed (PowerShell decides a step by the exit code of
# its last native command, so an earlier failure disappears). The publish job
# also lists the release afterwards, so a missing asset cannot pass unnoticed.
#
# The release itself is created by the "release" job, which reads the notes
# from .github/release-notes/<tag>.md, so both installers have a release to
# attach to and the page carries the right text.
#
# A manual run (workflow_dispatch) rebuilds a tag it already has a release for:
# the "release" step leaves an existing release untouched and the publish step
# re-uploads with --clobber, which is how a half-finished release is recovered
# without deleting and re-pushing the tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build and publish, e.g. v0.0.2
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build the tagged tree, never the branch the dispatch was started from
          ref: ${{ inputs.tag || github.ref }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving it untouched"
            exit 0
          fi
          notes=".github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --title "Office-cc $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --title "Office-cc $TAG" --notes "Office-cc $TAG"
          fi

  macos:
    needs: release
    # macos-14 was retired from GitHub Actions on 2026-11-02 — the day v0.0.1
    # shipped — and a job on it is cancelled at once with "configuration
    # 'macos-14-arm64-us-default' is not supported", which turns the run into
    # a cancelled release with no assets. Keep the label on a live image.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        # The release sidecar is a lipo fat binary (both mac arch packages ship
        # one path), so the Intel target has to be installable here too.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-bin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-bin-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # notices + build:all + the universal xlsx-sidecar + the shell package
      - name: Package the macOS installer
        run: npm run dist:mac

      # The OCR helper is a swiftc output. On a machine whose Swift cannot
      # compile (a CommandLineTools-only install redefines SwiftBridging) the
      # packager leaves it out with a warning and still exits 0, so a green
      # build says nothing about it — the shipped installer has to be opened
      # and checked. The sidecar is checked for the same reason: it is a
      # lipo fat binary, and a host-arch one would leave the other arch's
      # Sheets dead.
      - name: Verify the installer carries the OCR helper and the fat sidecar
        run: |
          set -euo pipefail
          dmg=$(ls apps/shell/release/*.dmg | head -1)
          mnt=$(mktemp -d)
          trap 'hdiutil detach "$mnt" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -nobrowse -readonly "$dmg" -mountpoint "$mnt" >/dev/null
          app="$mnt/Office-cc.app"
          ocr="$app/Contents/Resources/ocr/vision-ocr"
          sidecar="$app/Contents/Resources/native/xlsx-sidecar"
          if [ ! -f "$ocr" ]; then
            echo "the DMG ships without Resources/ocr/vision-ocr" >&2
            exit 1
          fi
          if [ ! -f "$sidecar" ]; then
            echo "the DMG ships without Resources/native/xlsx-sidecar" >&2
            exit 1
          fi
          echo "ocr helper: $(file -b "$ocr")"
          echo "ocr arches: $(lipo -archs "$ocr")"
          echo "sidecar arches: $(lipo -archs "$sidecar")"
          echo "version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-installer
          path: |
            apps/shell/release/*.dmg
            apps/shell/release/*-mac.zip
          retention-days: 30

  windows:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        # SHA-pinned (third-party action); the ref no longer selects the
        # toolchain, so it is passed explicitly.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          # own prefix: the build workflows' electron-* entries also hold
          # ~/.cache/electron-builder, and a saved key is never updated
          key: electron-bin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-bin-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build apps
        run: npm run build:all

      # The Windows package reads the xlsx sidecar from the MinGW cross-
      # compilation path, but a build on Windows produces it under the MSVC
      # target instead, so stage it where the packager looks for it.
      - name: Stage the xlsx sidecar
        shell: pwsh
        run: |
          $target = 'apps/sheets/native/xlsx-engine/target'
          New-Item -ItemType Directory -Force -Path "$target/x86_64-pc-windows-gnu/release" | Out-Null
          Copy-Item "$target/release/xlsx-sidecar.exe" "$target/x86_64-pc-windows-gnu/release/xlsx-sidecar.exe"

      - name: Package the Windows installer
        run: npm run dist:win -w @office-cc/shell

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: apps/shell/release/*.exe
          retention-days: 30

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download the macOS installer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macos-installer
          path: dist/macos

      - name: Download the Windows installer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-installer
          path: dist/windows

      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist/macos dist/windows
          # electron-builder's default Windows name carries a space ("Office-cc
          # Setup <version>.exe"); the release names it like the mac assets do.
          version="${TAG#v}"
          mv dist/windows/*.exe "dist/windows/Office-cc-$version-x64-Setup.exe"
          gh release upload "$TAG" dist/macos/*.dmg dist/macos/*-mac.zip \
            "dist/windows/Office-cc-$version-x64-Setup.exe" --clobber

      - name: Verify the release carries both installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          expected="Office-cc-$version-arm64.dmg Office-cc-$version-arm64-mac.zip Office-cc-$version-x64-Setup.exe"
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$assets"
          for name in $expected; do
            if ! echo "$assets" | grep -qx "$name"; then
              echo "release $TAG is missing $name" >&2
              exit 1
            fi
          done
